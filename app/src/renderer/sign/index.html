<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>QBot 留言牌</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none;user-select:none}
#sign{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 8px 8px;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s}
#sign.show{opacity:1;transform:none}
#board{position:relative;flex-shrink:0;max-width:160px;padding:10px 13px;border:2px solid #594235;border-radius:16px 16px 14px 14px;background:#fff9ef;color:#594235;font:600 14px/1.5 'Microsoft YaHei','PingFang SC',sans-serif;text-align:center;box-shadow:0 3px 0 #59423530;pointer-events:auto}
#text{display:block;max-width:9em;white-space:pre-line;overflow-wrap:anywhere;text-wrap:balance}
.post{flex:0 0 54px;width:9px;background:#d4b88d;border:1px solid #846747;border-top:0;border-radius:0 0 5px 5px}
#dismiss{position:absolute;top:-10px;right:-7px;width:22px;height:22px;padding:0;border:1px solid #b99b7b;border-radius:50%;background:#fff9ef;color:#846747;font:17px/20px sans-serif;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s}
#board.hovered #dismiss,#board:hover #dismiss,#board:focus-within #dismiss{opacity:1;pointer-events:auto}#dismiss:hover{background:#f0e0c6}#dismiss:focus-visible{outline:2px solid #846747;outline-offset:2px}
@media(prefers-reduced-motion:reduce){#sign{transition:none;transform:none}}
</style></head><body><div id="sign" role="status"><div id="board"><span id="text"></span><button id="dismiss" aria-label="收起留言牌" title="收起留言牌">×</button></div><div class="post" aria-hidden="true"></div></div><script type="module" src="./main.ts"></script></body></html>
