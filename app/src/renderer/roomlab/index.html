<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QBot · 横向房间试住</title></head><body>
<header><strong>横向房间试住</strong><nav><label>宽度 <select id="width"><option value="600">600</option><option value="800" selected>800</option><option value="1000">1000</option></select></label><button id="pin" aria-pressed="false">置顶</button><button id="photo">拍照</button><button id="edit" aria-expanded="false">安排角色</button></nav></header>
<main><canvas id="scene" aria-label="横向万圣节参考房间，安排角色模式下可拖动角色"></canvas><p id="loading" role="status">正在请朋友进来…</p></main>
<section id="controls" hidden><div id="spots" role="group" aria-label="角色位置"></div><div class="fields"><label>角色<select id="character"></select></label><label>动作<select id="action"></select></label><label>大小 <output id="sizeValue"></output><input id="size" type="range" min="65" max="145" value="100"></label><label>落脚位置<input id="offset" type="range" min="-45" max="5" value="0"></label><button id="save">记住安排</button></div><p id="note" role="status"></p></section>
<footer><span>明日方舟参考图 © Hypergryph · 本地试住</span><span id="summary"></span></footer><div id="sources" aria-hidden="true"></div><script type="module" src="./main.ts"></script></body></html>
