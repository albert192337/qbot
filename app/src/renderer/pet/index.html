<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot Pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #stage:active {
        cursor: grabbing;
      }
      #stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      #bubble {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 80%;
        z-index: 5;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        padding: 7px 12px;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
        line-height: 1.4;
        color: #3a3a3a;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        pointer-events: none;
        word-break: break-word;
        opacity: 0;
        visibility: hidden;
        transition: opacity 200ms;
      }
      #bubble.show {
        visibility: visible;
        opacity: 1;
      }
      #bubble.show.fade-out {
        opacity: 0;
      }
      #menu {
        display: none;
        position: absolute;
        z-index: 10;
        min-width: 110px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 10px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        padding: 4px;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
      }
      .menu-item {
        padding: 7px 14px;
        border-radius: 7px;
        cursor: pointer;
        color: #3a3a3a;
      }
      .menu-item:hover {
        background: #7cc47f;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bubble"></div>
    <div id="menu"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
