<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot Pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #stage:active {
        cursor: grabbing;
      }
      #stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        /* 角色在举牌之上（牌子从身后露出） */
        z-index: 1;
      }
      /* ── 动作切换烟雾过渡 ── */
      .stage-poof {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        background:
          radial-gradient(circle at 42% 52%, rgba(255,255,255,0.85) 0%, transparent 28%),
          radial-gradient(circle at 56% 48%, rgba(255,255,255,0.7) 0%, transparent 24%),
          radial-gradient(circle at 50% 58%, rgba(255,255,255,0.75) 0%, transparent 32%),
          radial-gradient(circle at 38% 46%, rgba(255,255,255,0.55) 0%, transparent 20%),
          radial-gradient(circle at 62% 50%, rgba(255,255,255,0.55) 0%, transparent 22%);
      }
      .stage-poof.go {
        animation: poof-burst 0.45s ease-out forwards;
      }
      @keyframes poof-burst {
        0%   { opacity: 0; transform: scale(0.25); }
        25%  { opacity: 1; transform: scale(0.55); }
        100% { opacity: 0; transform: scale(1.6); }
      }
      /* ── visitor stage ── */
      #visitor-stage {
        display: none;
        position: relative;
        width: 100%;
        height: 100%;
      }
      #visitor-stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        z-index: 1;
      }
      /* ── visit mode: side-by-side with overlap ── */
      body.visit-mode {
        display: flex;
        flex-direction: row;
        justify-content: center;
      }
      body.visit-mode #stage {
        flex: 0 0 50%;
        margin-right: -10%;
        z-index: 1;
      }
      body.visit-mode #visitor-stage {
        display: block;
        flex: 0 0 50%;
        margin-left: -10%;
        z-index: 0;
      }
      /* facing override: host needs flip to face right → left */
      body.visit-mode.flip-host #stage {
        transform: scaleX(-1);
      }
      /* facing override: visitor needs flip to face left → right */
      body.visit-mode.flip-visitor #visitor-stage {
        transform: scaleX(-1);
      }
      /* ── signboard（在角色身后，视频 z-index:1 压住它）── */
      .signboard {
        position: absolute;
        top: 14%;
        right: 12%;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition: opacity 0.3s ease;
      }
      .signboard.show {
        opacity: 1;
      }
      .signboard.poof-in {
        animation: signboard-pop 0.4s ease-out;
      }
      @keyframes signboard-pop {
        0%   { opacity: 0; transform: scale(0.4); }
        60%  { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      .signboard-board {
        background: linear-gradient(135deg, #fdf6e3 0%, #f5e6c8 100%);
        border: 3px solid #c4956a;
        border-radius: 8px;
        padding: 6px 12px;
        margin-top: 2px;
        font-family: 'STKaiti', 'KaiTi', 'SimKai', 'PingFang SC', serif;
        font-size: 13px;
        color: #5c3d2e;
        text-align: center;
        /* 长歌名会把牌子撑出窗口被裁掉（窗口默认仅 360px）→ 限宽 + 省略号 */
        max-width: 76vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
        min-width: 40px;
      }
      .signboard-post {
        width: 6px;
        height: 36px;
        background: linear-gradient(180deg, #c4956a 0%, #a0724a 100%);
        border-radius: 0 0 3px 3px;
      }
      #bubble {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 80%;
        z-index: 5;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        padding: 7px 12px;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
        line-height: 1.4;
        color: #3a3a3a;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        pointer-events: none;
        word-break: break-word;
        opacity: 0;
        visibility: hidden;
        transition: opacity 200ms;
      }
      #bubble.show {
        visibility: visible;
        opacity: 1;
      }
      #bubble.show.fade-out {
        opacity: 0;
      }
      #menu {
        display: none;
        position: absolute;
        z-index: 10;
        min-width: 110px;
        /* 菜单项多过窗口高度时截断顶部 → 限高滚动 */
        max-height: calc(100vh - 8px);
        overflow-y: auto;
        overscroll-behavior: contain;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 10px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        padding: 4px;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
      }
      .menu-item {
        padding: 7px 14px;
        border-radius: 7px;
        cursor: pointer;
        color: #3a3a3a;
      }
      .menu-item:hover {
        background: #7cc47f;
        color: white;
      }
      /* ── HUD：点数 + 宝箱（bongo cat 风格底部条） ── */
      #pet-hud {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 1.5%;
        z-index: 6;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 5%;
        pointer-events: none;
        font-size: clamp(9px, 3.4vh, 15px);
        transition: opacity 0.3s;
      }
      #pet-hud.lifted { opacity: 0; }
      body.visit-mode #pet-hud { right: 45%; }
      .hud-pill {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px 3px 8px;
        background: rgba(20, 20, 30, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        color: #fff;
        font-variant-numeric: tabular-nums;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        user-select: none;
      }
      .hud-mark { opacity: 0.7; }
      .hud-num { font-weight: 600; letter-spacing: 0.5px; }
      .hud-chest {
        pointer-events: auto;
        width: clamp(18px, 7vh, 34px);
        height: clamp(18px, 7vh, 34px);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        filter: drop-shadow(0 0 0.28em rgba(255, 196, 84, 0.75));
        animation: hud-breathe 1.9s ease-in-out infinite;
        transition: opacity 0.2s;
      }
      .hud-chest[hidden] { display: none; }
      .hud-chest.pop {
        animation: hud-chest-pop 0.45s ease-out, hud-breathe 1.9s ease-in-out 0.45s infinite;
      }
      .hud-chest:disabled { animation: none; opacity: 0.45; cursor: not-allowed; }
      .hud-float {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        color: #ffd166;
        font-weight: 700;
        font-size: 1.15em;
        pointer-events: none;
        opacity: 0;
        white-space: nowrap;
      }
      .hud-float.go { animation: hud-float-up 1.2s ease-out forwards; }
      .hud-toast {
        position: absolute;
        bottom: calc(100% + 4px);
        right: 0;
        padding: 5px 10px;
        border-radius: 8px;
        border-left: 3px solid #e0a33e;
        background: rgba(20, 20, 30, 0.85);
        color: #f0d68a;
        font-size: 0.9em;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        white-space: nowrap;
      }
      .hud-toast.show { opacity: 1; }
      @keyframes hud-breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-9%) scale(1.07); }
      }
      @keyframes hud-chest-pop {
        0% { transform: scale(0.4); }
        60% { transform: scale(1.14); }
        100% { transform: scale(1); }
      }
      @keyframes hud-float-up {
        0% { opacity: 1; transform: translateX(-50%) translateY(0); }
        70% { opacity: 0.6; }
        100% { opacity: 0; transform: translateX(-50%) translateY(-28px); }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="visitor-stage"></div>
    <div id="bubble"></div>
    <div id="menu"></div>
    <div id="pet-hud" class="lifted"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
