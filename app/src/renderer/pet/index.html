<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot Pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #stage:active {
        cursor: grabbing;
      }
      #stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
