<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot Pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #stage:active {
        cursor: grabbing;
      }
      #stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      /* ── 动作切换烟雾过渡 ── */
      .stage-poof {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        background:
          radial-gradient(circle at 42% 52%, rgba(255,255,255,0.85) 0%, transparent 28%),
          radial-gradient(circle at 56% 48%, rgba(255,255,255,0.7) 0%, transparent 24%),
          radial-gradient(circle at 50% 58%, rgba(255,255,255,0.75) 0%, transparent 32%),
          radial-gradient(circle at 38% 46%, rgba(255,255,255,0.55) 0%, transparent 20%),
          radial-gradient(circle at 62% 50%, rgba(255,255,255,0.55) 0%, transparent 22%);
      }
      .stage-poof.go {
        animation: poof-burst 0.45s ease-out forwards;
      }
      @keyframes poof-burst {
        0%   { opacity: 0; transform: scale(0.25); }
        25%  { opacity: 1; transform: scale(0.55); }
        100% { opacity: 0; transform: scale(1.6); }
      }
      /* ── visitor stage ── */
      #visitor-stage {
        display: none;
        position: relative;
        width: 100%;
        height: 100%;
      }
      #visitor-stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      /* ── visit mode: side-by-side with overlap ── */
      body.visit-mode {
        display: flex;
        flex-direction: row;
        justify-content: center;
      }
      body.visit-mode #stage {
        flex: 0 0 50%;
        margin-right: -10%;
        z-index: 1;
      }
      body.visit-mode #visitor-stage {
        display: block;
        flex: 0 0 50%;
        margin-left: -10%;
        z-index: 0;
      }
      /* facing override: host needs flip to face right → left */
      body.visit-mode.flip-host #stage {
        transform: scaleX(-1);
      }
      /* facing override: visitor needs flip to face left → right */
      body.visit-mode.flip-visitor #visitor-stage {
        transform: scaleX(-1);
      }
      /* ── signboard ── */
      .signboard {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 12%;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition: opacity 0.3s ease;
      }
      .signboard.show {
        opacity: 1;
      }
      .signboard.poof-in {
        animation: signboard-pop 0.4s ease-out;
      }
      @keyframes signboard-pop {
        0%   { opacity: 0; transform: scale(0.4); }
        60%  { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      .signboard-board {
        background: linear-gradient(135deg, #fdf6e3 0%, #f5e6c8 100%);
        border: 3px solid #c4956a;
        border-radius: 8px;
        padding: 6px 12px;
        margin-top: 2px;
        font-family: 'STKaiti', 'KaiTi', 'SimKai', 'PingFang SC', serif;
        font-size: 13px;
        color: #5c3d2e;
        text-align: center;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
        min-width: 40px;
      }
      .signboard-post {
        width: 6px;
        flex: 1;
        min-height: 60px;
        background: linear-gradient(180deg, #c4956a 0%, #a0724a 100%);
        border-radius: 0 0 3px 3px;
      }
      #bubble {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 80%;
        z-index: 5;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        padding: 7px 12px;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
        line-height: 1.4;
        color: #3a3a3a;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        pointer-events: none;
        word-break: break-word;
        opacity: 0;
        visibility: hidden;
        transition: opacity 200ms;
      }
      #bubble.show {
        visibility: visible;
        opacity: 1;
      }
      #bubble.show.fade-out {
        opacity: 0;
      }
      #menu {
        display: none;
        position: absolute;
        z-index: 10;
        min-width: 110px;
        /* 菜单项多过窗口高度时截断顶部 → 限高滚动 */
        max-height: calc(100vh - 8px);
        overflow-y: auto;
        overscroll-behavior: contain;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 10px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        padding: 4px;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
      }
      .menu-item {
        padding: 7px 14px;
        border-radius: 7px;
        cursor: pointer;
        color: #3a3a3a;
      }
      .menu-item:hover {
        background: #7cc47f;
        color: white;
      }
      /* ── debug panel（入口在右键菜单「调试面板」）── */
      #debug-panel {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 99;
        max-height: 40%;
        background: rgba(20, 20, 30, 0.85);
        border-top: 1px solid rgba(255,255,255,0.12);
        font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        font-size: 10px;
        line-height: 1.45;
        color: #ccc;
        padding: 4px 6px;
        overflow: hidden;
        pointer-events: auto;
        -webkit-user-select: text;
        user-select: text;
      }
      /* 面板打开时，stage 上移让出空间（串门模式下不压缩） */
      body.has-debug-panel #stage,
      body.has-debug-panel #visitor-stage {
        height: 65%;
      }
      body.visit-mode.has-debug-panel #stage,
      body.visit-mode.has-debug-panel #visitor-stage {
        height: 100%;
      }
      .debug-btns {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
      }
      .debug-btns button {
        padding: 2px 8px;
        font-size: 10px;
        font-family: inherit;
        background: rgba(255,255,255,0.1);
        color: #ccc;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 3px;
        cursor: pointer;
      }
      .debug-btns button:hover {
        background: rgba(255,255,255,0.22);
        color: #fff;
      }
      .debug-state {
        margin-bottom: 4px;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        color: #9cf;
      }
      .debug-state b {
        color: #fff;
      }
      .debug-log {
        max-height: 140px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.15) transparent;
      }
      .debug-log-time {
        color: rgba(255,255,255,0.35);
        margin-right: 4px;
      }
      .debug-chars {
        margin-bottom: 4px;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        color: #aac;
        font-size: 10px;
      }
      .debug-chars b {
        color: #ccf;
      }
      .debug-char-row {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin-right: 8px;
      }
      .debug-char-btn {
        padding: 1px 5px;
        font-size: 9px;
        font-family: inherit;
        background: rgba(255,255,255,0.08);
        color: #aac;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 2px;
        cursor: pointer;
      }
      .debug-char-btn:hover {
        background: rgba(255,255,255,0.2);
        color: #fff;
      }
      .debug-char-del {
        color: #f88;
        border-color: rgba(255,100,100,0.3);
      }
      .debug-char-del:hover {
        background: rgba(255,60,60,0.3);
        color: #faa;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="visitor-stage"></div>
    <div id="bubble"></div>
    <div id="menu"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
