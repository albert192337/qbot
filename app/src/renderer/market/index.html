<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot 装扮市场</title>
    <style>
      :root {
        --ink: #3a3a3a;
        --sub: #8a8a8a;
        --line: #ececec;
        --accent: #7cc47f;
        --danger: #e07a6a;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #faf9f7;
        color: var(--ink);
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
        -webkit-user-select: none;
        user-select: none;
      }
      /* ── 顶栏 ── */
      #topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(250, 249, 247, 0.96);
        border-bottom: 1px solid var(--line);
      }
      #topbar h1 {
        margin: 0;
        font-size: 15px;
        flex: 1;
      }
      #topbar input, #topbar select {
        font-family: inherit;
        font-size: 12px;
        padding: 5px 8px;
        border: 1px solid #ddd;
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }
      #nickname { width: 84px; }
      #upload-select { max-width: 140px; }
      button {
        font-family: inherit;
        font-size: 12px;
        padding: 5px 12px;
        border: none;
        border-radius: 7px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      button.ghost {
        background: transparent;
        color: var(--sub);
        border: 1px solid #ddd;
      }
      button.danger { background: var(--danger); }
      /* ── 状态条 ── */
      #status {
        padding: 6px 14px;
        font-size: 12px;
        color: var(--sub);
        min-height: 18px;
      }
      #status.error { color: var(--danger); }
      /* ── 货架 ── */
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
        padding: 4px 14px 20px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      }
      .card .cover {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: #f2efe9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
      }
      .card .body { padding: 8px 10px 10px; }
      .card .name {
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .meta {
        color: var(--sub);
        font-size: 11px;
        margin: 3px 0 8px;
      }
      .card .btns { display: flex; gap: 6px; }
      .card .btns button { flex: 1; }
      #empty {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--sub);
        padding: 60px 0;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <h1>装扮市场</h1>
      <input id="nickname" placeholder="昵称" maxlength="24" title="上传署名（保存在本机）" />
      <select id="upload-select" title="选择要上传的角色"></select>
      <button id="upload-btn">上传</button>
      <button id="refresh-btn" class="ghost">刷新</button>
    </div>
    <div id="status"></div>
    <div id="grid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
