<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"><title>桌面弹珠</title></head><body><canvas id="field" aria-label="桌面弹珠与奖励卡牌"></canvas><div id="fixture"></div>
<div id="toolbar" class="panel interactive"><span class="brand">✦ 桌面弹珠</span><span id="balance"></span><button id="edit" title="设置图标机关" aria-pressed="false">机关</button><button id="test-wheel" hidden>测试转盘</button><button id="sound" title="音效">♪</button><button id="close" title="关闭">×</button></div>
