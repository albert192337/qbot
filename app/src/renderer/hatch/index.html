<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot 孵化室</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, 'PingFang SC', sans-serif;
      }
      body {
        margin: 0;
        background: #faf7f0;
        color: #3a3a3a;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .screen {
        display: none;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
      }
      .screen.active {
        display: flex;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      .hint {
        color: #8a8a8a;
        font-size: 13px;
        text-align: center;
        line-height: 1.7;
      }
      /* drop 屏 */
      #dropzone {
        width: 420px;
        height: 260px;
        border: 3px dashed #c9c0ae;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 15px;
        color: #9a917e;
        transition: all 0.15s;
      }
      #dropzone.over {
        border-color: #7cc47f;
        background: #f0f8f0;
        color: #5aa05e;
      }
      /* pick 屏 */
      #candidates {
        display: flex;
        gap: 16px;
      }
      #candidates img {
        width: 200px;
        border-radius: 12px;
        border: 3px solid transparent;
        cursor: pointer;
        background: white;
        transition: border-color 0.15s;
      }
      #candidates img:hover {
        border-color: #7cc47f;
      }
      button {
        font-size: 14px;
        padding: 9px 22px;
        border-radius: 10px;
        border: 1px solid #d4cbb8;
        background: white;
        cursor: pointer;
      }
      button.primary {
        background: #7cc47f;
        border-color: #7cc47f;
        color: white;
      }
      /* progress 屏 */
      #action-grid {
        display: grid;
        grid-template-columns: repeat(3, 120px);
        gap: 16px;
      }
      .action-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 8px;
        border-radius: 12px;
        background: #f1ece0;
        opacity: 0.45;
        font-size: 13px;
        transition: all 0.3s;
      }
      .action-cell .dot {
        font-size: 26px;
      }
      .action-cell.done {
        opacity: 1;
        background: #e6f4e6;
      }
      .action-cell.failed {
        opacity: 1;
        background: #fbe9e7;
      }
      .action-cell.working {
        opacity: 0.8;
      }
      /* certificate 屏 */
      #card {
        display: flex;
        gap: 24px;
        align-items: center;
        background: white;
        border-radius: 20px;
        padding: 28px 36px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
      }
      #card img,
      #card video {
        width: 132px;
        height: 132px;
        object-fit: contain;
      }
      /* 全动作画廊：2×3 小视频，棋盘格底衬出透明 */
      #card-actions {
        display: grid;
        grid-template-columns: repeat(3, 132px);
        gap: 10px;
      }
      #card-actions figure {
        margin: 0;
        text-align: center;
        font-size: 12px;
        color: #8a8a8a;
      }
      #card-actions video {
        width: 132px;
        height: 132px;
        object-fit: contain;
        border-radius: 10px;
        background:
          conic-gradient(#eee 90deg, #fff 90deg 180deg, #eee 180deg 270deg, #fff 270deg)
          0 0/16px 16px;
      }
      #card .arrow {
        font-size: 28px;
        color: #c9c0ae;
      }
      #error-banner {
        display: none;
        background: #fbe9e7;
        color: #b3413a;
        padding: 10px 16px;
        font-size: 13px;
        text-align: center;
      }
      #pet-name,
      #api-key {
        font-size: 15px;
        padding: 9px 14px;
        border-radius: 10px;
        border: 1px solid #d4cbb8;
        width: 220px;
        text-align: center;
        outline-color: #7cc47f;
      }
    </style>
  </head>
  <body>
    <div id="error-banner"></div>

    <section id="screen-drop" class="screen active">
      <h1>孵化一只新桌宠</h1>
      <div id="dropzone">
        <div style="font-size: 40px">🥚</div>
        <div>把角色图片拖到这里</div>
      </div>
      <div id="provider-row" class="hint">
        生图模型：
        <label><input type="radio" name="image-provider" value="seedream" checked /> 火山 Seedream</label>
        <label><input type="radio" name="image-provider" value="gpt-image-2" /> GPT-Image-2（慢，约 5 分钟/张）</label>
      </div>
      <div id="form-row" class="hint">
        角色形态：
        <label><input type="radio" name="character-form" value="humanoid" checked /> 人形/兽形</label>
        <label><input type="radio" name="character-form" value="abstract" /> 抽象（线条小狗、简笔涂鸦等）</label>
      </div>
      <div id="style-row" class="hint">
        生成风格：
        <label><input type="radio" name="character-style" value="chibi" checked /> Q 版（二头身，任意素材都适用）</label>
        <label><input type="radio" name="character-style" value="faithful" /> 高保真（保持原图头身比与画风）</label>
      </div>
      <p class="hint">
        一张图一个角色，画面清晰、全身或半身为佳<br />
        孵化约需 20 分钟，期间可以关掉这个窗口
      </p>
      <div id="resume-area"></div>
    </section>

    <section id="screen-pick" class="screen">
      <h1>挑一张你最喜欢的设定图</h1>
      <div id="candidates"></div>
      <button id="regen">都不满意，重新生成</button>
      <p class="hint">这张三视图决定角色所有动作的一致性，选对最重要</p>
    </section>

    <section id="screen-progress" class="screen">
      <h1>孵化中…</h1>
      <div id="action-grid"></div>
      <p class="hint">小家伙正在学习怎么动，关掉窗口也不会打断孵化</p>
    </section>

    <section id="screen-certificate" class="screen">
      <h1>出生证明</h1>
      <div id="card">
        <img id="card-source" alt="原图" />
        <div class="arrow">→</div>
        <div id="card-actions"></div>
      </div>
      <input id="pet-name" type="text" placeholder="给它起个名字…" maxlength="12" />
      <div style="display: flex; gap: 12px">
        <button id="save-card">保存卡片</button>
        <button id="go-desk" class="primary">上桌！</button>
      </div>
    </section>

    <section id="screen-settings" class="screen">
      <h1>设置</h1>
      <label class="hint" for="api-key">火山方舟 Ark API Key（孵化新角色时使用）</label>
      <input id="api-key" type="password" placeholder="粘贴你的 API Key" style="width: 340px" />
      <label class="hint" for="gpt-image-key">GPT-Image-2 API Key（选用该生图模型时需要）</label>
      <input id="gpt-image-key" type="password" placeholder="sk-…" style="width: 340px" />
      <label class="hint" for="pet-scale">桌宠大小 <span id="pet-scale-value">100%</span></label>
      <input id="pet-scale" type="range" min="0.5" max="2" step="0.1" value="1" style="width: 260px" />
      <label class="hint">语音</label>
      <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
        <label style="display: flex; gap: 6px; align-items: center; font-size: 13px">
          <input id="voice-enabled" type="checkbox" checked /> 开启叽歪语音
        </label>
        <label style="display: flex; gap: 6px; align-items: center; font-size: 13px">
          音量 <input id="voice-volume" type="range" min="0" max="100" step="5" value="70" style="width: 120px" />
          <span id="voice-volume-value">70</span>
        </label>
        <label style="display: flex; gap: 6px; align-items: center; font-size: 13px">
          说话频率
          <select id="talk-frequency">
            <option value="quiet">安静</option>
            <option value="normal" selected>正常</option>
            <option value="chatty">话痨</option>
          </select>
        </label>
      </div>
      <div style="display: flex; gap: 12px">
        <button id="settings-back">返回</button>
        <button id="settings-save" class="primary">保存</button>
      </div>
      <p class="hint" id="settings-status"></p>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
