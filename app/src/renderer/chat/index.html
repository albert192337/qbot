<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>和桌宠聊聊</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:6px;background:transparent;color:#4b352b;font-family:'Microsoft YaHei','PingFang SC',sans-serif}
form{background:#fff9ef;border:2px solid #594235;border-radius:12px;padding:10px 12px;box-shadow:0 3px 0 #59423540}
.row{display:flex;align-items:center;gap:8px}textarea{flex:1;min-width:0;height:46px;resize:none;border:0;outline:0;background:transparent;color:inherit;font:600 15px/1.55 'Microsoft YaHei','PingFang SC',sans-serif}textarea::placeholder{color:#a28c7d;font-weight:400}
button{cursor:pointer;font:600 13px 'Microsoft YaHei',sans-serif;color:#594235;border:0;background:transparent;padding:6px}button:focus-visible{outline:2px solid #b99a73;border-radius:5px}button:disabled{opacity:.45;cursor:wait}#send{background:#f0e0c6;border:1px solid #c6aa86;border-radius:7px;white-space:nowrap}footer{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:#9a8070;margin-top:4px}#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#status.error{color:#a34435}
</style></head><body><form id="chat-form"><div class="row"><textarea id="message" maxlength="1000" placeholder="想和我说些什么？" aria-label="聊天内容" autofocus></textarea><button id="send" type="submit">发送 ↵</button></div><footer><span id="status" role="status">Enter 发送 · Shift + Enter 换行</span><button type="button" id="close" aria-label="收起聊天">收起 ×</button></footer></form><script type="module" src="./main.ts"></script></body></html>
