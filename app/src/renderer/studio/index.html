<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot 角色工作室</title>
    <style>
      html, body {
        margin: 0; padding: 12px;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
        color: #333;
        background: #f5f5f5;
        overflow-y: auto;
      }
      h2 { margin: 0 0 10px; font-size: 16px; }
      h3 { margin: 14px 0 6px; font-size: 13px; color: #666; }
      label { display: block; margin: 6px 0 2px; font-weight: 600; font-size: 12px; color: #555; }
      textarea, input[type="text"] {
        width: 100%; box-sizing: border-box;
        padding: 5px 7px; font-family: inherit; font-size: 12px;
        border: 1px solid #ccc; border-radius: 4px; resize: vertical;
      }
      textarea { min-height: 40px; }
      .btn-row { display: flex; gap: 6px; margin: 8px 0; }
      button {
        padding: 5px 12px; font-size: 12px; font-family: inherit;
        border: 1px solid #aaa; border-radius: 4px; cursor: pointer; background: #fff;
      }
      button:hover { background: #e8e8e8; }
      button.primary { background: #4a8; color: #fff; border-color: #4a8; }
      button.primary:hover { background: #3a7; }
      button.danger { color: #c33; border-color: #c33; }
      button.danger:hover { background: #fee; }
      .action-card {
        background: #fff; border: 1px solid #ddd; border-radius: 6px;
        padding: 8px 10px; margin: 6px 0;
      }
      .action-card .meta { font-size: 11px; color: #999; margin-bottom: 4px; }
      .action-card video { max-width: 120px; max-height: 120px; display: block; margin: 4px 0; }
      .action-card .status { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
      .status-done { background: #d4edda; color: #155724; }
      .status-pending { background: #fff3cd; color: #856404; }
      .status-failed { background: #f8d7da; color: #721c24; }

      .tabs { display: flex; gap: 0; margin-bottom: 12px; border-bottom: 2px solid #ddd; }
      .tab-btn {
        padding: 6px 16px; font-size: 13px; border: none; background: none;
        color: #888; cursor: pointer; border-bottom: 2px solid transparent;
        margin-bottom: -2px;
      }
      .tab-btn:hover { color: #555; }
      .tab-btn.active { color: #4a8; border-bottom-color: #4a8; font-weight: 600; }
      .tab-content { display: none; }
      .tab-content.active { display: block; }

      .prompt-block {
        background: #fff; border: 1px solid #ddd; border-radius: 6px;
        padding: 8px 10px; margin: 8px 0;
      }
      .prompt-block summary {
        cursor: pointer; font-weight: 600; font-size: 12px; color: #555;
        padding: 2px 0; user-select: none;
      }
      .prompt-block pre {
        white-space: pre-wrap; word-break: break-word;
        font-size: 11px; line-height: 1.5; color: #444;
        background: #fafafa; padding: 6px 8px; border-radius: 4px;
        margin: 6px 0 0 0; max-height: 200px; overflow-y: auto;
      }
      .config-params {
        font-size: 12px; color: #666; line-height: 1.8;
      }
      .config-params b { color: #333; }

      /* 花钱操作的警示框 */
      .warn-box {
        background: #fff8e1; border: 1px solid #ffcc80; border-radius: 6px;
        padding: 8px 10px; margin: 8px 0; font-size: 11px;
        line-height: 1.6; color: #7a4f00;
      }
      .warn-box b { color: #b34700; }
      .badge-custom {
        display: inline-block; padding: 1px 6px; border-radius: 3px;
        background: #e3f2fd; color: #1565c0; font-size: 10px; font-weight: 600;
        vertical-align: middle;
      }
      .hint {
        font-size: 10px; color: #999; line-height: 1.5; margin: 4px 0 0;
      }
      .hint code {
        background: #f0f0f0; padding: 0 3px; border-radius: 2px; font-size: 10px;
      }
      .prompt-block textarea {
        font-family: 'SF Mono', 'Consolas', monospace;
        font-size: 11px; line-height: 1.5; min-height: 60px;
      }
      button:disabled { opacity: 0.5; cursor: default; }

      /* ── 表情包导入 ───────────────────────────────── */
      .sticker-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px; margin: 10px 0;
      }
      .sticker-card {
        border: 1px solid #ddd; border-radius: 6px; padding: 8px;
        background: #fff; font-size: 11px;
      }
      /* 三色置信度：绿=自动采纳 黄=建议确认 红=必须人工指定 */
      .sticker-card.tier-high { border-left: 4px solid #4caf50; }
      .sticker-card.tier-medium { border-left: 4px solid #ffb300; }
      .sticker-card.tier-low { border-left: 4px solid #e53935; }
      .sticker-card img {
        width: 100%; height: 110px; object-fit: contain;
        background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 50%/12px 12px;
        border-radius: 4px;
      }
      .sticker-card .name {
        font-weight: 600; color: #444; margin: 4px 0 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .sticker-card .reason { color: #999; font-size: 10px; line-height: 1.4; min-height: 26px; }
      .sticker-card select { width: 100%; font-size: 11px; margin-top: 4px; }
      .conf-badge {
        display: inline-block; padding: 0 5px; border-radius: 3px;
        font-size: 10px; font-weight: 600;
      }
      .conf-high { background: #d4edda; color: #155724; }
      .conf-medium { background: #fff3cd; color: #856404; }
      .conf-low { background: #f8d7da; color: #721c24; }
      .sticker-bar {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin: 10px 0; padding: 8px; background: #f0f4f8; border-radius: 6px;
      }
      .sticker-bar .spacer { flex: 1; }
      #sticker-status { font-size: 11px; color: #666; }
    </style>
  </head>
  <body>
    <h2>🎨 角色工作室</h2>
    <div class="tabs">
      <button class="tab-btn active" data-tab="actions">动作配置</button>
      <button class="tab-btn" data-tab="stickers">表情包导入</button>
      <button class="tab-btn" data-tab="prompts">生成 Prompt</button>
    </div>
    <div id="tab-actions" class="tab-content active"></div>
    <div id="tab-stickers" class="tab-content"></div>
    <div id="tab-prompts" class="tab-content"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
