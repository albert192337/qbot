<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听雨茶室 · 3D 试住</title></head><body>
<header><div class="brand"><span class="seal">茶</span><div><h1>听雨茶室</h1><p>雨落窗外，留一盏灯。</p></div><span class="badge">3D 试住</span></div><div class="header-actions"><button id="concept">看原画</button><button id="undo" disabled>撤销</button><button id="save" class="primary">保存布置</button></div></header>
<main id="viewport" aria-label="可交互的三维茶室"><div id="stage"></div><div class="viewbar" aria-label="房间视角"><button data-view="home" aria-pressed="true">生活</button><button data-view="edit" aria-pressed="false">布置</button><button data-view="tower" aria-pressed="false">楼层</button><span></span><button id="left" aria-label="向左转动视角">↶</button><button id="right" aria-label="向右转动视角">↷</button><button id="zoom-in" aria-label="拉近视角">＋</button><button id="zoom-out" aria-label="拉远视角">−</button></div>
<div class="room-label"><span>01</span><div>听雨茶室<small id="room-caption">青竹 · 原木 · 青瓷</small></div></div>
<aside id="selection" hidden><small>正在布置</small><h2 id="selected-name"></h2><p id="selected-info"></p><div class="actions"><button id="rotate">旋转 45°</button><button id="remove">收起</button></div><label>替换家具<select id="replace"></select></label><button id="sit" class="primary">坐在这里</button><button id="stand">回到地面</button><p class="hint">拖动家具移动 · 方向键微调<br>R 旋转 · Esc 取消拖动</p></aside>
<div id="status" role="status">正在打开茶室…</div><div class="bottom-help">拖动家具布置 · 拖动空处转动视角 · 滚轮缩放</div></main>
<footer><div class="shelf-head"><div><h2>茶室家具</h2><span>选择一件，添入房间</span></div><div><label><input type="checkbox" id="snap" checked> 网格吸附</label><button id="reset">恢复茶室</button></div></div><div id="shelf" aria-label="家具库"></div></footer>
<dialog id="art-dialog"><button id="close-art" aria-label="关闭原画">关闭</button><h2>听雨茶室 · 美术原画</h2><p>青绿软榻、深木茶柜与雨夜窗景。下方是可独立替换的家具设计。</p><img id="art" alt="雨夜茶室与沙发、茶桌、茶柜的原创设计原画"></dialog>
<div id="sources" aria-hidden="true"></div><script type="module" src="./main.js"></script></body></html>
