<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot 联机空间</title>
    <style>
      :root {
        --ink: #3a3a3a;
        --sub: #8a8a8a;
        --line: #ececec;
        --accent: #7cc47f;
        --danger: #e07a6a;
        --mine: #eaf5ea;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #faf9f7;
        color: var(--ink);
        font-family: -apple-system, 'PingFang SC', sans-serif;
        font-size: 13px;
        -webkit-user-select: none;
        user-select: none;
      }
      body { display: flex; flex-direction: column; }
      button {
        font-family: inherit;
        font-size: 12px;
        padding: 5px 12px;
        border: none;
        border-radius: 7px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      button.ghost {
        background: #fff;
        color: var(--sub);
        border: 1px solid #ddd;
      }
      button.danger { background: var(--danger); }
      input, select {
        font-family: inherit;
        font-size: 12px;
        padding: 5px 8px;
        border: 1px solid #ddd;
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }
      input:focus, select:focus { border-color: var(--accent); }

      /* ── 顶栏 ── */
      #topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(250, 249, 247, 0.96);
        border-bottom: 1px solid var(--line);
      }
      #topbar h1 { margin: 0; font-size: 15px; flex: 1; }
      #nickname { width: 90px; }

      /* ── 筛选 tab ── */
      #tabs {
        display: flex;
        gap: 4px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .tab {
        padding: 4px 10px;
        border-radius: 12px;
        color: var(--sub);
        cursor: pointer;
        font-size: 12px;
      }
      .tab.on { background: var(--accent); color: #fff; }
      #search { flex: 1; min-width: 60px; }

      /* ── 房间列表 ── */
      #list { flex: 1; overflow-y: auto; padding: 8px 14px 14px; }
      .room {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .room-main { flex: 1; min-width: 0; }
      .room-name {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .room-meta { font-size: 11px; color: var(--sub); margin-top: 3px; }
      .kind {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 8px;
        background: #f0f0ee;
        margin-right: 6px;
      }
      .fav { cursor: pointer; font-size: 14px; color: #ddd; }
      .fav.on { color: #f0b429; }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 4px;
      }
      .dot.off { background: #d5d5d5; }

      /* ── 房内 ── */
      #room-view { flex: 1; display: none; flex-direction: column; min-height: 0; }
      #room-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      #room-title { flex: 1; font-size: 14px; font-weight: 500; }
      #display-mode-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 9px 14px;
        background: #f4f3ef;
        border-bottom: 1px solid var(--line);
      }
      .display-mode-copy { min-width: 0; }
      .display-mode-title { font-size: 12px; font-weight: 600; }
      #display-mode-hint { margin-top: 2px; color: var(--sub); font-size: 11px; }
      .mode-switch {
        display: inline-flex;
        flex: none;
        padding: 2px;
        border: 1px solid #dddcd7;
        border-radius: 8px;
        background: #e9e8e3;
      }
      .mode-switch button {
        min-width: 76px;
        padding: 5px 9px;
        border-radius: 6px;
        background: transparent;
        color: var(--sub);
        box-shadow: none;
      }
      .mode-switch button:hover:not(:disabled) { color: var(--ink); }
      .mode-switch button.on {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 3px rgba(40, 40, 30, 0.12);
      }
      .mode-switch button:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 60%, white);
        outline-offset: 1px;
      }
      #members {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        max-height: 116px;
        overflow-y: auto;
      }
      .member {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px 4px 4px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        cursor: pointer;
      }
      .member.offline { opacity: 0.45; }
      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #f0f0ee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex: none;
      }
      .member-name { font-size: 12px; }
      .member-mode { font-size: 11px; color: var(--sub); }

      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        -webkit-user-select: text;
        user-select: text;
      }
      .msg { max-width: 78%; }
      .msg.mine { align-self: flex-end; }
      .msg-who { font-size: 11px; color: var(--sub); margin-bottom: 3px; }
      .msg.mine .msg-who { text-align: right; }
      .bubble {
        padding: 7px 10px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        line-height: 1.45;
        word-break: break-word;
      }
      .msg.mine .bubble { background: var(--mine); border-color: #d9e9d9; }
      .msg-del {
        font-size: 11px;
        color: var(--sub);
        cursor: pointer;
        margin-top: 2px;
        text-align: right;
        display: none;
      }
      .msg.mine:hover .msg-del { display: block; }
      .sys {
        align-self: center;
        font-size: 11px;
        color: var(--sub);
        background: #f2f1ef;
        padding: 3px 10px;
        border-radius: 10px;
      }

      #composer {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }
      #chat-input { flex: 1; }

      /* ── 状态条 / 弹层 ── */
      #status {
        padding: 6px 14px;
        font-size: 11px;
        color: var(--sub);
        border-top: 1px solid var(--line);
        min-height: 15px;
      }
      #status.error { color: var(--danger); }
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.28);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      #modal.on { display: flex; }
      .sheet {
        background: #faf9f7;
        border-radius: 12px;
        padding: 16px;
        width: 280px;
      }
      .sheet h2 { margin: 0 0 12px; font-size: 14px; }
      .field { margin-bottom: 10px; }
      .field label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 4px; }
      .field input, .field select { width: 100%; box-sizing: border-box; }
      .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
      .hint { font-size: 11px; color: var(--sub); line-height: 1.5; }
      #empty { text-align: center; color: var(--sub); padding: 40px 20px; font-size: 12px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <!-- 列表视图 -->
    <div id="list-view" style="flex:1; display:flex; flex-direction:column; min-height:0">
      <div id="topbar">
        <h1>联机空间</h1>
        <input id="nickname" placeholder="昵称" maxlength="16" />
        <button id="create-btn">开房</button>
      </div>
      <div id="tabs">
        <span class="tab on" data-kind="">全部</span>
        <span class="tab" data-kind="idle">摸鱼</span>
        <span class="tab" data-kind="study">自习</span>
        <span class="tab" data-kind="night">夜猫</span>
        <span class="tab" data-kind="coop">联机</span>
        <input id="search" placeholder="搜房名" maxlength="24" />
        <button id="refresh-btn" class="ghost">刷新</button>
      </div>
      <div id="list"></div>
    </div>

    <!-- 房内视图 -->
    <div id="room-view">
      <div id="room-head">
        <span id="room-title"></span>
        <button id="settings-btn" class="ghost" style="display:none">设置</button>
        <button id="leave-btn" class="ghost">退出房间</button>
      </div>
      <div id="display-mode-bar">
        <div class="display-mode-copy">
          <div class="display-mode-title">宠物显示位置</div>
          <div id="display-mode-hint">只改变本机画面，不会退出或重连房间</div>
        </div>
        <div class="mode-switch" role="group" aria-label="联机空间展示模式">
          <button type="button" data-display-mode="room" aria-pressed="false">开启房间背景</button>
          <button type="button" data-display-mode="desktop" aria-pressed="false">关闭房间背景</button>
        </div>
      </div>
      <div id="members"></div>
      <div id="chat"></div>
      <div id="composer">
        <input id="chat-input" placeholder="说点什么…" maxlength="200" />
        <button id="send-btn">发送</button>
      </div>
    </div>

    <div id="status"></div>

    <!-- 弹层：开房 / 房间设置 / 发言须知 -->
    <div id="modal"><div class="sheet" id="sheet"></div></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
