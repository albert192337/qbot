<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QBot Bubble</title>
    <link rel="stylesheet" href="../speech-bubble.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none; /* 窗口本身已 setIgnoreMouseEvents，这里再兜一层 */
      }
      #stack {
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* 贴底 = 贴桌宠头顶；最新的在最下面 */
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 100%;
        padding: 0 10px;
        box-sizing: border-box;
      }
      body.below #stack {
        justify-content: flex-start; /* 桌宠贴屏幕顶部时气泡翻到脚下 */
      }
      .bubble {
        max-width: 100%;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 180ms, transform 180ms;
      }
      .bubble.attention {
        border: 2px solid #594235;
      }
      .bubble.pet-speech .src { display: none; }
      .bubble.show {
        opacity: 1;
        transform: none;
      }
      .bubble.fade-out {
        opacity: 0;
        transition-duration: 260ms;
      }
      .src {
        font-size: 10px;
        color: #9a9a9a;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bubble.attention .src {
        color: #d08a2c;
      }
    .reward-card{position:relative;width:210px;border:2px solid #ded5ae;border-radius:20px;background:#fff9e6;padding:10px;box-shadow:0 4px 0 #8c806932,0 6px 18px #40332220}
.reward-close{pointer-events:auto;position:absolute;top:3px;right:4px;width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:#8b7850;font-size:21px;cursor:pointer}
.reward-close:hover{background:#e9e1c7}
.reward-card .text{color:#8b7850;font-size:13px;letter-spacing:1px;margin-bottom:7px}
.reward-grid{display:flex;justify-content:center;gap:10px}
.reward-tile{flex:1;min-width:0;text-align:center;background:#f2ecd3;border-radius:20px;padding:10px 6px 8px;color:#686447;font-size:12px}
.reward-tile .supply-art{display:flex;width:48px;height:48px;margin:0 auto 4px;align-items:center;justify-content:center;background:radial-gradient(#fff5bd,transparent 70%)}
.reward-tile img,.reward-tile svg{width:100%;height:100%;object-fit:contain}
.reward-tile b{display:block;font-size:14px;margin-top:2px;color:#709378}
.reward-tile .supply-art{position:relative}
.reward-tile .fert-grade{position:absolute;bottom:0;left:0;right:0;font-size:8px;text-align:center;color:#8b7850}
.rare-reward.show{animation:rare-unbox .65s ease-out}
.rare-reward .reward-tile{background:radial-gradient(ellipse at top,#fff3bd,#f2ecd3)}
@keyframes rare-unbox{0%{box-shadow:0 0 0 0 #f5cf70;transform:scale(.94)}45%{box-shadow:0 0 26px 5px #f5cf70a0;transform:scale(1.02)}100%{box-shadow:0 4px 0 #8c806932,0 6px 18px #40332220;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.rare-reward.show{animation:none}}
</style>
  </head>
  <body>
    <div id="stack"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
