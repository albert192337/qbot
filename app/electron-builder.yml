appId: dev.qbot.app
productName: QBot
# monorepo 提升的 node_modules 里 electron 版本无法从 range 推断 → 显式钉死
electronVersion: 37.10.3
directories:
  output: release
files:
  - out/**
extraResources:
  - from: resources/presets
    to: presets
  - from: resources/tray-win.png
    to: tray-win.png
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
mac:
  category: public.app-category.entertainment
  target:
    - dmg
  # 本地分发暂不签名；上架/公证时再配 identity + notarize
  identity: null
# 图标：build/icon.png（512，由 app/build/make-icon.mts 从预置吉祥物生成），
# electron-builder 自动转各平台格式（win ico / mac icns）
win:
  target:
    - nsis
    - zip # 免安装绿色版
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
