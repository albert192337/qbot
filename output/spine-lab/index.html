<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QBot · 骨骼换装试验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#383e35;font-family:'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:36px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:8px 0}small{letter-spacing:3px;color:#7a856c}p{color:#7b7d70;line-height:1.7}.badge{background:#e5eadb;border-radius:24px;padding:12px 20px;font-size:13px}.stage{margin:25px 0 18px;border:1px solid #dfdfcf;border-radius:24px;background:radial-gradient(ellipse at 50% 70%,#fffdf5,#edeedb);overflow:hidden;position:relative}.stage:after{content:'';position:absolute;left:0;right:0;bottom:90px;border-bottom:1px solid #dde0cc;pointer-events:none}canvas{display:block;width:100%;height:500px}.labels{position:absolute;bottom:35px;display:flex;width:100%;justify-content:space-around;text-align:center}.labels b{font-size:16px}.labels span{display:block;font-size:12px;color:#8a8c7d;margin-top:6px}.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}button,select{border:1px solid #d4d8c8;border-radius:12px;background:#fffef8;padding:10px 14px;color:inherit;font:inherit;cursor:pointer}button.active{background:#4e6955;color:white;border-color:#4e6955}label{font-size:13px}#all{max-width:300px}footer{margin-top:20px;font-size:12px;color:#878a7c}#error{color:#a64038;white-space:pre-wrap}input[type=range]{accent-color:#526c58;width:100px}
</style><main><header><div><small>QBOT / MOTION LAB</small><h1>一个骨骼，让不同角色动起来</h1><p>共用动作 · 独立贴图 · 实时表情</p></div><div class="badge" id="stats">正在读取骨骼</div></header><div class="stage"><canvas id="canvas" width="1100" height="500"></canvas><div class="labels"><div><b>原始角色</b><span>提供的骨骼与图集</span></div><div><b id="new-name">换皮角色</b><span id="new-note">相同动作与网格</span></div></div></div><div class="bar" id="actions"></div><p class="bar"><label>全部动作 <select id="all"></select></label><button id="pause">暂停</button><label>速度 <input id="speed" type="range" min="0.2" max="1.5" step="0.1" value="1"></label><label><input id="bones" type="checkbox"> 显示骨骼</label></p><div id="error"></div><footer>本地可行性样例 · 新贴图需遵循原部件画布、关节位置和遮挡关系。</footer></main><script src="vendor/spine-webgl.js"></script><script src="lab.js"></script></html>
